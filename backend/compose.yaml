# Base de datos PostgreSQL 16 para desarrollo: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ferreteria
      POSTGRES_USER: ferreteria
      POSTGRES_PASSWORD: ferreteria
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data

volumes:
  datos:

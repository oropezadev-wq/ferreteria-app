spring.application.name=ferreteria-api

# Base de datos PostgreSQL. Los valores se pueden cambiar con variables de entorno.
# Para levantarla con Docker: docker compose up -d (desde la carpeta backend).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ferreteria}
spring.datasource.username=${DB_USUARIO:ferreteria}
spring.datasource.password=${DB_CLAVE:ferreteria}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Token JWT: firma HS256 con esta clave (mínimo 32 caracteres) y vigencia de un turno de trabajo.
# En un servidor real la clave se define con la variable de entorno JWT_SECRETO.
app.jwt.secreto=${JWT_SECRETO:clave-de-desarrollo-ferreteria-cambiar-en-servidor}
app.jwt.horas=8

# Solo escucha en la propia PC.
server.address=127.0.0.1
server.port=8081

# Origen del frontend Angular en desarrollo.
app.cors.origen=http://localhost:4200

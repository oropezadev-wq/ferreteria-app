spring.application.name=ferreteria-api

# Prototipo: H2 en archivo para no instalar un servidor; la versión final usa PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/ferreteria;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Solo escucha en la propia PC.
server.address=127.0.0.1
server.port=8081

# Origen del frontend Angular en desarrollo.
app.cors.origen=http://localhost:4200

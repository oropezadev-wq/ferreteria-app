# Versión portable: este mismo servidor entrega la página de Angular (carpeta web/ junto al .jar),
# así todo funciona en http://localhost:8081 sin instalar Node ni abrir otra terminal.
# Se activa desde iniciar.bat; la base es PostgreSQL (con Docker) o H2 (perfil h2) si no hay Docker.
spring.web.resources.static-locations=file:web/
app.cors.origen=http://localhost:8081
